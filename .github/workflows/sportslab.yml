name: Build SportsLab iOS

on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'Development for iPhone testing; app-store for TestFlight/App Store; unsigned for compile check'
        type: choice
        default: development
        options:
          - development
          - app-store
          - unsigned
  push:
    branches: [main]
    paths:
      - 'apps/SportsLab/**'
      - '.github/workflows/sportslab.yml'

permissions:
  contents: read

concurrency:
  group: sportslab-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    runs-on: macos-latest
    timeout-minutes: 45
    environment: APPLE_TEAM_ID
    env:
      IPA_MODE: ${{ inputs.signing || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run SportsLab XCTest on iOS Simulator
        run: |
          SIM_UDID=$(python3 -c '
          import json, re, subprocess
          inv = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True))
          cands = []
          for rt, devs in inv.get("devices", {}).items():
              m = re.fullmatch(r"com\.apple\.CoreSimulator\.SimRuntime\.iOS-(\d+)-(\d+)(?:-(\d+))?", rt)
              if not m: continue
              ver = tuple(int(x or 0) for x in m.groups())
              if ver < (17, 0, 0): continue
              for d in devs:
                  if d.get("isAvailable") and str(d.get("deviceTypeIdentifier", "")).startswith("com.apple.CoreSimulator.SimDeviceType.iPhone-"):
                      cands.append((ver, d["udid"], d["name"]))
          if not cands:
              raise SystemExit("No available iOS 17+ iPhone simulator found")
          ver, udid, name = sorted(cands)[-1]
          print(f"Using simulator: {name} ({udid})", file=__import__("sys").stderr)
          print(udid)
          ')
          xcodebuild test \
            -project apps/SportsLab/SportsLab.xcodeproj \
            -scheme SportsLab \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned SportsLab IPA
        if: env.IPA_MODE == 'unsigned'
        run: |
          set -euo pipefail
          mkdir -p .runtime/sportslab-ipa
          ARCHIVE_PATH="$RUNNER_TEMP/SportsLab-unsigned.xcarchive"
          xcodebuild archive \
            -project apps/SportsLab/SportsLab.xcodeproj \
            -scheme SportsLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          PayloadDir="$RUNNER_TEMP/Payload"
          rm -rf "$PayloadDir"
          mkdir -p "$PayloadDir"
          cp -R "$ARCHIVE_PATH/Products/Applications/SportsLab.app" "$PayloadDir/SportsLab.app"
          (cd "$RUNNER_TEMP" && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/.runtime/sportslab-ipa/SportsLab-unsigned.ipa")
          shasum -a 256 .runtime/sportslab-ipa/SportsLab-unsigned.ipa > .runtime/sportslab-ipa/SportsLab-unsigned.ipa.sha256

      - name: Archive & Export Signed SportsLab IPA
        if: env.IPA_MODE != 'unsigned'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEV_CERTIFICATE_P12: ${{ secrets.DEV_CERTIFICATE_P12 }}
          DEV_P12_PASSWORD: ${{ secrets.DEV_P12_PASSWORD || secrets.P12_PASSWORD }}
          SPORTSLAB_DEV_PROVISION_PROFILE: ${{ secrets.SPORTSLAB_DEV_PROVISION_PROFILE }}
          DIST_CERTIFICATE_P12: ${{ secrets.DIST_CERTIFICATE_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD || secrets.P12_PASSWORD }}
          SPORTSLAB_DIST_PROVISION_PROFILE: ${{ secrets.SPORTSLAB_DIST_PROVISION_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p .runtime/sportslab-ipa

          if [ "$IPA_MODE" = "development" ]; then
            CERT_B64="$DEV_CERTIFICATE_P12"
            CERT_PASS="$DEV_P12_PASSWORD"
            PROF_B64="$SPORTSLAB_DEV_PROVISION_PROFILE"
            EXPORT_METHOD="debugging"
            EXPECTED_PREFIX="Apple Development"
          else
            CERT_B64="$DIST_CERTIFICATE_P12"
            CERT_PASS="$DIST_P12_PASSWORD"
            PROF_B64="$SPORTSLAB_DIST_PROVISION_PROFILE"
            EXPORT_METHOD="app-store-connect"
            EXPECTED_PREFIX="Apple Distribution"
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/sportslab-build.keychain-db"
          KEYCHAIN_PASS="sportslab-ci-temp"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          OLD_KC=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $OLD_KC

          P12_FILE="$RUNNER_TEMP/signing.p12"
          echo "$CERT_B64" | tr -d '[:space:]' | base64 --decode > "$P12_FILE"
          security import "$P12_FILE" -k "$KEYCHAIN_PATH" -P "$CERT_PASS" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "$EXPECTED_PREFIX" | head -n 1 | awk '{print $2}')
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/[0-9A-F]{40}/ {print $2; exit}')
          fi

          PROFILE_FILE="$RUNNER_TEMP/sportslab.mobileprovision"
          echo "$PROF_B64" | tr -d '[:space:]' | base64 --decode > "$PROFILE_FILE"
          DECODED_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_FILE" > "$DECODED_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$DECODED_PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$DECODED_PLIST")
          BUNDLE_ID="${APP_ID#${APPLE_TEAM_ID}.}"

          for REL_DIR in "Library/Developer/Xcode/UserData/Provisioning Profiles" "Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$HOME/$REL_DIR"
            cp "$PROFILE_FILE" "$HOME/$REL_DIR/$PROFILE_UUID.mobileprovision"
          done

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild archive \
            -project apps/SportsLab/SportsLab.xcodeproj \
            -scheme SportsLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SportsLab.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            SKIP_INSTALL=NO

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SportsLab.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath .runtime/sportslab-ipa

          for f in .runtime/sportslab-ipa/*.ipa; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Upload SportsLab IPA and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: SportsLab-${{ env.IPA_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runtime/sportslab-ipa/*.ipa
            .runtime/sportslab-ipa/*.ipa.sha256
          if-no-files-found: error
          retention-days: 7
