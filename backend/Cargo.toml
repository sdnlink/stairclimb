[package]
name = "stairclimb"
version = "0.1.0"
edition = "2021"
default-run = "stairclimb-server"

[features]
test-support = []

[dependencies]
argon2 = "0.5"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
postgres = "0.19"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-general-category = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"

[[bin]]
name = "stairclimb-server"
path = "src/main.rs"

[[bin]]
name = "stairclimb-test-server"
path = "src/bin/test_server.rs"
required-features = ["test-support"]
